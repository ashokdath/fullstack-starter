services:

  # The gateway on http://localhost, as in production behind the server's nginx
  proxy:
    ports:
      - "80:80"

  db:
    ports:
      - "5432:5432"

  # Database web administration, local only
  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "8080:8080"

  backend:
    ports:
      - "8000:8000"
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - python
      - manage.py
      - runserver
      - "0.0.0.0:8000"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      ENVIRONMENT: "development"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"

  frontend:
    # No published port: open http://localhost (the nginx proxy), which routes
    # /api and /django-admin to the backend on the same origin
    develop:
      watch:
        - path: ./frontend
          action: rebuild
          ignore:
            - ./frontend/node_modules
            - ./frontend/dist
            - ./frontend/blob-report
            - ./frontend/test-results

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - NODE_ENV=production
    ipc: host
    # Share the proxy's network: http://localhost here is the full stack behind
    # nginx (production frontend + backend on one origin), the same URL as
    # FRONTEND_HOST in the backend's email links
    network_mode: service:proxy
    depends_on:
      proxy:
        condition: service_started
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      - PLAYWRIGHT_BASE_URL=http://localhost
      - API_INTERNAL_URL=http://localhost
      - MAILPIT_HOST=http://mailpit:8025
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
