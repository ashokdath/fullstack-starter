# Deployment settings, combined with compose.yml:
#   docker compose -f compose.yml -f compose.deploy.yml up -d
#
# The project's gateway (`proxy`) is its only published port, bound to
# localhost. The server's own nginx (shared by all projects on the server)
# handles HTTPS and forwards the domain to it. Give each project on the server
# its own APP_PORT. See nginx/host-site.conf.template and
# deployment-docker-compose.md.
services:

  proxy:
    restart: always
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"

  db:
    restart: always

  backend:
    restart: always
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}

  frontend:
    restart: always
    environment:
      SITE_URL: https://${DOMAIN:?Variable not set}
