[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
    "django>=6.1.2,<6.2",
    "django-ninja>=1.7.1,<2.0.0",
    "django-cors-headers>=4.9.0,<5.0.0",
    "gunicorn>=26.2.0,<27.0.0",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "pydantic>=2.13.5",
    "pydantic-settings<3.0.0,>=2.2.1",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sentry-sdk[django]>=2.70.0,<3.0.0",
    "pyjwt>=2.15.0,<3.0.0",
    "argon2-cffi>=25.1.0",
    "django-stubs-ext>=5.2.0",
    "django-unfold>=0.110.0",
    "django-storages[s3]>=1.14.6",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "pytest-django>=4.14.0,<5.0.0",
    "mypy<3.0.0,>=1.8.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "ruff<1.0.0,>=0.16.0",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "app.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "migrations"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["app.*.migrations.*"]
ignore_errors = true

# django-unfold ships no py.typed marker; analyse its source for types
[[tool.mypy.overrides]]
module = ["unfold.*"]
follow_untyped_imports = true

[tool.django-stubs]
django_settings_module = "app.settings"

[tool.ruff]
target-version = "py314"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HttpError
    "ARG001", # Ninja views receive `request` even when unused
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
omit = ["app/*/migrations/*", "app/wsgi.py", "app/asgi.py"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
