# Project gateway: the single entry point of the stack (the `proxy` service).
# /api and /django-admin go to Django, everything else to the frontend, so API
# traffic never passes through the frontend server.
#
# In production it listens on 127.0.0.1:APP_PORT behind the server's own nginx
# (see nginx/host-site.conf.template), locally on http://localhost.

# Keep the scheme the outer proxy saw (https in production), fall back to this
# server's own scheme when called directly (local development).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    # Docker's DNS, re-resolved at runtime: a redeploy that recreates the
    # backend or frontend container (new IP) keeps working without a restart
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    # $http_host keeps a non-default port (Django compares it with the Origin)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Django trusts it to know the request came over HTTPS
    # (SECURE_PROXY_SSL_HEADER): only reachable through the outer proxy, which
    # always sets it
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Django: the API and the admin. /static is only used without object
    # storage, in development (`runserver` serves it with DEBUG).
    location ~ ^/(api|django-admin|static)(/|$) {
        proxy_pass $backend;
    }

    # Everything else: the frontend
    location / {
        proxy_pass $frontend;
    }
}
