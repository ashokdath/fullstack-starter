name: Test Docker Compose

on:
  push:
    branches:
      - main
      - master
  pull_request:
permissions:
  contents: read

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose run --rm backend bash scripts/prestart.sh
      - run: docker compose up -d --wait proxy backend frontend adminer
      # Single port through the nginx gateway: /api and /django-admin go to
      # Django, everything else to the frontend
      - name: Test backend is up
        run: curl --fail http://localhost/api/v1/utils/health-check/
      - name: Test Django admin is routed to the backend
        run: curl --fail http://localhost/django-admin/login/
      - name: Test frontend is server-rendered
        run: curl --fail --silent http://localhost/ | grep --quiet "<h1"
      - run: docker compose down -v --remove-orphans
